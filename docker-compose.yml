# Start with: docker compose up --build
# Web: http://localhost:3000
# API: http://localhost:8000/docs
# SLA_HOUR_SECONDS=60 makes one SLA hour last one minute.

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://vishanti_app:vishanti_app_pw@db:5432/vishanti
  MIGRATE_DATABASE_URL: postgresql+asyncpg://vishanti:vishanti@db:5432/vishanti
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-secret}
  SLA_HOUR_SECONDS: ${SLA_HOUR_SECONDS:-60}

  # Keep local file storage; MinIO remains disabled.
  STORAGE_BACKEND: local

  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_ACCESS_KEY: vishanti
  S3_SECRET_KEY: vishanti-secret
  S3_BUCKET: vishanti

  PUBLIC_API_URL: http://localhost:8000
  CORS_ORIGINS: http://localhost:3000

  # Use local ML models when available; otherwise fall back to hashing.
  EMBEDDINGS_BACKEND: ${EMBEDDINGS_BACKEND:-auto}

  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  CHECKPOINT_GIST_ID: ${CHECKPOINT_GIST_ID:-}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vishanti
      POSTGRES_PASSWORD: vishanti
      POSTGRES_DB: vishanti
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vishanti -d vishanti"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # ML-enabled backend image.
  # WITH_ML=1 installs dependencies and downloads models during the build.

  migrate:
    build:
      context: ./backend
      args:
        WITH_ML: "1"
    environment: *backend-env
    command: ["python", "-m", "app.init_db", "--demo"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: ./backend
      args:
        WITH_ML: "1"
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      args:
        WITH_ML: "1"
    environment: *backend-env
    command:
      - celery
      - -A
      - app.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    build:
      context: ./backend
      args:
        WITH_ML: "1"
    environment: *backend-env
    command:
      - celery
      - -A
      - app.celery_app
      - beat
      - --loglevel=INFO
      - -s
      - /tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      INTERNAL_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata: